name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? The margins shown in the status bar help a lot.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Window / application concerned
      placeholder: e.g. Ankama Launcher, Discord, Notepad…
  - type: input
    id: version
    attributes:
      label: Pile Poil version
      placeholder: e.g. 1.0.0 (right-click PilePoil.exe > Properties > Details)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 10 22H2, Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: Screens
      description: How many screens, their resolution and scaling (Settings > Display).
      placeholder: e.g. 2 screens, 1920×1080 at 100 % and 2560×1440 at 125 %
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if useful.
