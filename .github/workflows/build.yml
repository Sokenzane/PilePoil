name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with the .NET Framework C# compiler
        shell: cmd
        run: build.bat ci

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: PilePoil
          path: dist/PilePoil.exe

      - name: Prepare the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "Version = \"$version\"" src/PilePoil.cs; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Program.Version in src/PilePoil.cs"
            exit 1
          fi
          tr -d '\r' < CHANGELOG.md | awk -v v="$version" '$0 == "## " v {f=1; next} /^## /{f=0} f' > notes.md
          {
            echo
            echo "### Download"
            echo
            echo "[**PilePoil.exe**](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/PilePoil.exe) — Windows 10/11, nothing to install."
            echo
            echo "SHA-256: \`$(sha256sum dist/PilePoil.exe | cut -d' ' -f1)\`"
          } >> notes.md
          cat notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Pile Poil ${{ github.ref_name }}
          body_path: notes.md
          files: dist/PilePoil.exe
